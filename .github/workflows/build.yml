name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Inteligente do Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Configurar Permissao do Executavel
      run: chmod +x gradlew

    - name: Compilar APK (Incremental Build)
      run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

    - name: Salvar APK como Artefato
      uses: actions/upload-artifact@v4
      with:
        name: teste2.0-Debug-APK
        path: app/build/outputs/apk/debug/*.apk